    <!-- Contenido principal -->
    <main class="row">
      <section class="contenido col-12">
        <h2 class="section-title">Contact me</h2>
        <p>Feel free to reach out for research collaborations, sample inquiries, or academic discussions.</p>
      </section>
      <!-- Formulario de contacto -->
      <section class="formulario col-10">
        <form action="https://api.staticforms.dev/submit" method= "POST">
                    <input type="hidden" name="apiKey" value="sf_0375ab28733e788afa3c5f3f">
                    <input type="hidden" name="subject" value="Esther Manzanares Ubeda submission">
          <div class="fila mb-3">
            <label for="name" class="form-label fw-semibold">Name *</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Dr. Jane Doe" required>
          </div>

          <div class="fila mb-3">
            <label for="email" class="form-label fw-semibold">Email address *</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="name@institution.edu"
              required>
          </div>

          <div class=" fila mb-3">
            <label for="institution" class="form-label fw-semibold">Institution / Affiliation <span
                class="text-muted fw-normal">(Optional)</span></label>
            <input type="text" class="form-control" id="institution" name="institution"
              placeholder="University or Research Center">
          </div>

          <div class="fila mb-3">
            <label for="subject" class="form-label fw-semibold">Subject *</label>
            <select class="form-select" id="subject" name="subject">
              <option value="Collaboration" selected>Research Collaboration</option>
              <option value="Publication / Data">Publication or Data Request</option>
              <option value="Conference / Talk">Conference / Seminar Invitation</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="fila mb-4">
            <label for="message" class="form-label fw-semibold">Message*</label>
            <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here..."
              required></textarea>
          </div>

          <div class="d-grid col-3">
            <button id="btn_submit" type="submit" class="btn">
              Send Message
            </button>
          </div>
        </form>
      </section>
    </main>
